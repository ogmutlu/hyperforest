[workspace]
members = ["crates/domain", "crates/bridge"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
opt-level = "s"
