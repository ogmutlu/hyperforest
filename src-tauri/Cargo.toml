[package]
name = "hyperforest-desktop"
version = "1.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
chrono = "0.4"

[features]
# Opt-in native performance harness. Never enabled in normal application builds.
benchmark = []
